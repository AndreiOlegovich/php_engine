[project]
name = "php-engine-container"
version = "0.1.0"
description = "Docker setup + pytest link checker for a PHP site"
readme = "README.md"
requires-python = ">=3.12"
# Runtime deps of the pytest suite and the ported tools.
dependencies = [
  "pytest>=8",
  "requests>=2.31",
  "allure-pytest>=2.13",
  "pyyaml>=6",
  "pygments>=2.21",
]

[dependency-groups]
dev = [
  "mypy>=1.18",
  "pylint>=3.3",
  "ruff>=0.14",
]

# Not an installable package: uv sync only creates .venv with the deps above.
[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 800
exclude = [".venv/", "src/", "reports/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
show_error_codes = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["^src/", "^\\.venv/", "^reports/"]

[tool.pylint."MESSAGES CONTROL"]
disable = [
  "missing-docstring",
  "redefined-outer-name",
  "too-few-public-methods",
  "too-many-arguments",
  "too-many-positional-arguments",
  "too-many-locals",
  "too-many-branches",
  "duplicate-code",
  "too-many-lines",
  "unused-argument",
]
max-line-length = 800

[tool.pylint."REPORTS"]
output-format = "text"
score = "n"

[tool.pylint."MISCELLANEOUS"]
notes = ["FIXME", "TODO", "XXX", "HACK"]
