# Pre-commit gates for the php_engine repo (repo root: this file's directory).
#
# Install once per clone:
#   pre-commit install
# (pre-commit itself: `uv tool install pre-commit`.)
# All Python hook environments run on the same interpreter as the project.
default_language_version:
  python: python3.12
#
# Gates:
#   .py  -> ruff check, ruff format, mypy, pylint; not the site's own Python
#           under container/src, which is often legacy (Python 2).
#   .php -> php -l (syntax) + phpcs PSR-12 on staged files under container/src.
#   .sh  -> shellcheck via container/tools/linters/lint-sh.sh.
#   diff -> check-diff-artifacts.sh --staged on every commit.
#   images -> container/docs/image-files.txt rewritten when an image changes.
# Manual full run:
#   pre-commit run --all-files
repos:
  # --- Python: ruff (lint + format) ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        name: ruff check (.py)
        files: \.py$
        exclude: ^container/src/
        args: [--config, container/pyproject.toml]
      - id: ruff-format
        name: ruff format (.py)
        files: \.py$
        exclude: ^container/src/
        args: [--config, container/pyproject.toml]

  # --- Python: mypy (types; lenient baseline in container/pyproject.toml) ---
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        name: mypy (.py)
        files: \.py$
        exclude: ^container/src/
        args: [--config-file, container/pyproject.toml]
        additional_dependencies:
          - pytest>=8
          - requests>=2.31
          - pyyaml>=6

  # --- Python: pylint (messages control in container/pyproject.toml) ---
  - repo: https://github.com/pylint-dev/pylint
    rev: v4.0.8
    hooks:
      - id: pylint
        name: pylint (.py)
        files: \.py$
        exclude: ^container/src/
        args: [--rcfile=container/pyproject.toml]
        additional_dependencies:
          - pytest>=8
          - requests>=2.31
          - pyyaml>=6
          - allure-pytest>=2.13

  # --- PHP: syntax (php -l) on staged files under container/src ---
  - repo: local
    hooks:
      - id: php-lint-src
        name: php -l (container/src, staged)
        entry: container/tools/linters/lint-php.sh --staged
        language: system
        files: ^container/src/.*\.php$
        pass_filenames: false

  # --- PHP: style (phpcs PSR-12 + project ruleset) on staged files ---
  - repo: local
    hooks:
      - id: phpcs-src
        name: phpcs (container/src, staged)
        entry: container/tools/linters/lint-static.sh --tool phpcs --staged
        language: system
        files: ^container/src/.*\.php$
        pass_filenames: false

  # --- Shell: shellcheck (maintained scripts; wrapper owns the scope) ---
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck (maintained .sh)
        entry: container/tools/linters/lint-sh.sh --staged
        language: system
        files: \.sh$
        pass_filenames: false

  # --- Version markers must be bumped with every change ---
  - repo: local
    hooks:
      - id: check-version
        name: check-version (staged markers)
        entry: container/tools/linters/check-version.sh
        language: system
        pass_filenames: false

  # --- Python toolchain must agree on 3.12 ---
  - repo: local
    hooks:
      - id: check-python-consistency
        name: python 3.12 consistency
        entry: python3.12 container/tools/linters/check_python_consistency.py --require-precommit
        language: system
        always_run: true
        pass_filenames: false

  # --- Image list stays true to the image files on disk ---
  # .gitignore leaves the images out of git: container/docs/image-files.txt
  # records each one's path, size and sha1 instead, so git shows which images
  # the site has and a backup or the hosting copy can be checked against it.
  # Adding or replacing an image touches no tracked file, so this hook always
  # runs. It regenerates the list and fails when the file changed (the
  # formatter pattern): stage the new list and commit again. In a checkout
  # without the images (a worktree, the OpenCode container) fewer than half
  # of the listed paths exist on disk; the hook says so and exits 0 instead
  # of emptying the list.
  - repo: local
    hooks:
      - id: image-list
        name: image list (container/docs/image-files.txt)
        entry: python3.12 container/tools/images/image_list.py --hook
        language: system
        pass_filenames: false
        always_run: true

  # --- image_list.py self-test (runs only when the script changes) ---
  # The list format and order, --write/--check/--hook, the cache and the
  # no-images skip, all on tmp_path trees: no images needed.
  - repo: local
    hooks:
      - id: image-list-tests
        name: image list tests (script changes)
        entry: pytest container/tests/tools/test_image_list.py -q
        language: python
        files: ^container/tools/images/image_list\.py$
        pass_filenames: false
        additional_dependencies: ["pytest>=8"]

  # --- Diff artifacts (EOL flips, encoding damage, mojibake, BOM) ---
  - repo: local
    hooks:
      - id: check-diff-artifacts
        name: check-diff-artifacts (staged, byte damage only)
        entry: container/tools/check-diff-artifacts.sh --staged
        language: system
        always_run: true
        pass_filenames: false

  # --- Site checkers (container/src): what the page files must look like ---
  # Each hook scans the whole docroot, not only the staged files, because a
  # rule about the site as a whole (line endings, a duplicate <loc>) cannot
  # be judged file by file. What each failure means: container/docs/site-checks.md
  - repo: local
    hooks:
      - id: site-line-endings
        name: "line endings (container/src: LF, no mixed file)"
        entry: container/tools/linters/check-line-endings.sh --search --all --src src
        language: system
        files: ^container/src/
        pass_filenames: false
      - id: site-php-blank-lines
        name: PHP whitespace-only lines (container/src)
        entry: container/tools/linters/check-php-blank-lines.sh --search --all --src src
        language: system
        files: ^container/src/
        pass_filenames: false
      - id: site-php-header
        name: PHP opening header, one empty line (container/src)
        entry: container/tools/linters/check-php-header.sh --search --all --src src
        language: system
        files: ^container/src/
        pass_filenames: false
      - id: site-malformed-urls
        name: malformed URLs (container/src)
        entry: container/tools/linters/find-malformed-urls.sh --all --src src
        language: system
        files: ^container/src/
        pass_filenames: false
      - id: site-snake-calls
        name: snake_case method calls on the engine API (container/src)
        entry: python3 container/tools/linters/find-snake-calls.py --src container/src
        language: system
        files: ^container/src/
        pass_filenames: false
      - id: site-sitemap
        name: sitemap.xml parses, one document, unique loc (container/src)
        entry: >-
          bash -c '[ -f container/src/sitemap.xml ] || { echo "site-sitemap: SKIP, container/src/sitemap.xml does not exist yet"; exit 0; }; container/tools/check-sitemap.sh container/src/sitemap.xml'
        language: system
        always_run: true
        pass_filenames: false
      - id: site-redirected-pages
        name: a new page is not a redirect source (container/src/.htaccess)
        entry: >-
          bash -c '[ -f container/src/.htaccess ] || { echo "site-redirected-pages: SKIP, container/src/.htaccess does not exist yet"; exit 0; }; container/tools/check-no-redirected-pages.sh'
        language: system
        always_run: true
        pass_filenames: false

  # --- HTML/PHP reflower damage gate (whole-tree text scan) ---
  - repo: local
    hooks:
      - id: check-reflow
        name: check-reflow (container/src reflower damage)
        entry: container/tools/linters/check-reflow.sh
        language: system
        always_run: true
        pass_filenames: false

  # --- Hygiene on maintained text files ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        name: no trailing whitespace
        files: \.(py|sh|php|yaml|yml|toml|md)$
        exclude: ^(container/src/|container/tests/fixtures/broken_site/)
      - id: end-of-file-fixer
        name: EOF newline
        files: \.(py|sh|php|yaml|yml|toml|md)$
        exclude: ^(container/src/|container/tests/fixtures/broken_site/)
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict

  # --- lint-php.sh self-test (gate script changes) ---
  - repo: local
    hooks:
      - id: lint-php-sh-selftest
        name: lint-php.sh self test
        entry: pytest container/tests/linters/test_lint_php_sh.py -q
        language: python
        files: ^container/tools/linters/lint-php\.sh$
        pass_filenames: false
        additional_dependencies: ["pytest>=8"]

  # --- phpcs gate self-test (gate script, ruleset or wiring changes) ---
  - repo: local
    hooks:
      - id: lint-static-sh-selftest
        name: phpcs gate self test
        entry: pytest container/tests/linters/test_lint_static_sh.py -q
        language: python
        files: ^(container/tools/linters/lint-static\.sh|container/phpcs\.xml|\.pre-commit-config\.yaml)$
        pass_filenames: false
        additional_dependencies: ["pytest>=8", "pyyaml>=6"]

  # --- lint-static.py self test (Python port of the phpcs gate) ---
  - repo: local
    hooks:
      - id: lint-static-py-selftest
        name: lint-static.py self test
        entry: pytest container/tests/linters/test_lint_static_fix_offer.py -q
        language: python
        files: ^(container/tools/linters/lint-static\.py|container/tools/linters/lint_static_with_py/.*)$
        pass_filenames: false
        additional_dependencies: ["pytest>=8"]
