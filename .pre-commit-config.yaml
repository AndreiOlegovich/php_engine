# Pre-commit gates for the php_engine repo (repo root: this file's directory).
#
# Install once per clone:
#   pre-commit install
# (pre-commit itself: `uv tool install pre-commit`.)
# All Python hook environments run on the same interpreter as the project.
default_language_version:
  python: python3.12
#
# Gates:
#   .py  -> ruff check, ruff format, mypy, pylint.
#   .php -> php -l (syntax) + phpcs PSR-12 on staged files under container/src.
#   .sh  -> shellcheck via container/tools/linters/lint-sh.sh.
#   diff -> check-diff-artifacts.sh --staged on every commit.
# Manual full run:
#   pre-commit run --all-files
repos:
  # --- Python: ruff (lint + format) ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        name: ruff check (.py)
        files: \.py$
        args: [--config, container/pyproject.toml]
      - id: ruff-format
        name: ruff format (.py)
        files: \.py$
        args: [--config, container/pyproject.toml]

  # --- Python: mypy (types; lenient baseline in container/pyproject.toml) ---
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        name: mypy (.py)
        files: \.py$
        args: [--config-file, container/pyproject.toml]
        additional_dependencies:
          - pytest>=8
          - requests>=2.31
          - pyyaml>=6

  # --- Python: pylint (messages control in container/pyproject.toml) ---
  - repo: https://github.com/pylint-dev/pylint
    rev: v4.0.8
    hooks:
      - id: pylint
        name: pylint (.py)
        files: \.py$
        args: [--rcfile=container/pyproject.toml]
        additional_dependencies:
          - pytest>=8
          - requests>=2.31
          - pyyaml>=6
          - allure-pytest>=2.13

  # --- PHP: syntax (php -l) on staged files under container/src ---
  - repo: local
    hooks:
      - id: php-lint-src
        name: php -l (container/src, staged)
        entry: container/tools/linters/lint-php.sh --staged
        language: system
        files: ^container/src/.*\.php$
        pass_filenames: false

  # --- PHP: style (phpcs PSR-12 + project ruleset) on staged files ---
  - repo: local
    hooks:
      - id: phpcs-src
        name: phpcs (container/src, staged)
        entry: container/tools/linters/lint-static.sh --tool phpcs --staged
        language: system
        files: ^container/src/.*\.php$
        pass_filenames: false

  # --- Shell: shellcheck (maintained scripts; wrapper owns the scope) ---
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck (maintained .sh)
        entry: container/tools/linters/lint-sh.sh --staged
        language: system
        files: \.sh$
        pass_filenames: false

  # --- Version markers must be bumped with every change ---
  - repo: local
    hooks:
      - id: check-version
        name: check-version (staged markers)
        entry: container/tools/linters/check-version.sh
        language: system
        pass_filenames: false

  # --- Python toolchain must agree on 3.12 ---
  - repo: local
    hooks:
      - id: check-python-consistency
        name: python 3.12 consistency
        entry: python3.12 container/tools/linters/check_python_consistency.py --require-precommit
        language: system
        always_run: true
        pass_filenames: false

  # --- Diff artifacts (EOL flips, encoding damage, full-file rewrites) ---
  - repo: local
    hooks:
      - id: check-diff-artifacts
        name: check-diff-artifacts (staged)
        entry: container/tools/check-diff-artifacts.sh --staged
        language: system
        always_run: true
        pass_filenames: false

  # --- HTML/PHP reflower damage gate (whole-tree text scan) ---
  - repo: local
    hooks:
      - id: check-reflow
        name: check-reflow (container/src reflower damage)
        entry: container/tools/linters/check-reflow.sh
        language: system
        always_run: true
        pass_filenames: false

  # --- Hygiene on maintained text files ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        name: no trailing whitespace
        files: \.(py|sh|php|yaml|yml|toml|md)$
        exclude: ^container/src/
      - id: end-of-file-fixer
        name: EOF newline
        files: \.(py|sh|php|yaml|yml|toml|md)$
        exclude: ^container/src/
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict

  # --- lint-php.sh self-test (gate script changes) ---
  - repo: local
    hooks:
      - id: lint-php-sh-selftest
        name: lint-php.sh self test
        entry: pytest container/tests/linters/test_lint_php_sh.py -q
        language: python
        files: ^container/tools/linters/lint-php\.sh$
        pass_filenames: false
        additional_dependencies: ["pytest>=8"]

  # --- phpcs gate self-test (gate script, ruleset or wiring changes) ---
  - repo: local
    hooks:
      - id: lint-static-sh-selftest
        name: phpcs gate self test
        entry: pytest container/tests/linters/test_lint_static_sh.py -q
        language: python
        files: ^(container/tools/linters/lint-static\.sh|container/phpcs\.xml|\.pre-commit-config\.yaml)$
        pass_filenames: false
        additional_dependencies: ["pytest>=8", "pyyaml>=6"]
