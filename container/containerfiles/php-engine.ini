; Local-dev PHP settings for an old codebase on a newer PHP.
; Code written for PHP 5 or 7 raises many E_DEPRECATED notices on PHP 8.5
; (dynamic properties, null passed to a built-in function, an optional
; parameter before a required one). error_reporting leaves them out, so they
; show neither on the page nor in the log. To list them while you modernise
; the code, set error_reporting = E_ALL here, run
; `docker compose restart php-apache` and read `docker compose logs php-apache`.
error_reporting = E_ALL & ~E_DEPRECATED
display_errors = On
log_errors = On
