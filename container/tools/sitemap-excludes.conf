# Sitemap exclusions for generate-sitemap.sh — one rule per line.
#   prune PATH      path relative to src, pruned with its subtree
#   dirname GLOB    directory name never descended
#   filename GLOB   file name never listed
# These are the framework conventions a legacy PHP tree needs; add the
# folders of your own site below them.
dirname .*
dirname _*
dirname arj
dirname arj[0-9]*
dirname * copy*
dirname demo
dirname *img
# An old hub kept for history; old links resolve, but it is not a page.
filename index_legacy.php
filename *RelatedArticles*.php
filename *_inc.php
filename *_arj.php
filename *-arj.php
filename *_include.php
filename *_module_*.php
filename *top_path.php
filename *_menu.php
filename *_top_menu.php
filename *menu?*.php
filename *left_block*.php
filename *right_block*.php
filename *topline*.php
filename form_processing*.php
filename validate_*.php
filename post_result.php
filename PUT_result.php
filename * copy.php
filename *copy(*.php
