; Local-dev PHP settings for an old codebase on a newer PHP.
; Site code written for PHP 5/7 emits
; E_DEPRECATED notices (dynamic properties, optional-param order, etc.).
; Hiding them from browser output so pages render cleanly; they still go
; to the Apache error log via log_errors.
error_reporting = E_ALL & ~E_DEPRECATED
display_errors = On
log_errors = On
